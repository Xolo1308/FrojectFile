<!-- blocked-page.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔒 Truy cập bị chặn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            max-width: 500px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            text-align: center;
        }
        
        .icon { font-size: 64px; margin-bottom: 16px; }
        
        h1 {
            font-size: 24px;
            color: #d32f2f;
            margin-bottom: 12px;
        }
        
        .subtitle {
            font-size: 15px;
            color: #555;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        
        .info-box {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
        }
        
        .info-box .label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .info-box .value {
            font-size: 14px;
            color: #333;
            margin-top: 4px;
            word-break: break-all;
        }
        
        .info-box .value.domain {
            font-weight: 600;
            color: #d32f2f;
        }
        
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #d32f2f;
            color: white;
        }
        
        .btn-primary:hover {
            background: #b71c1c;
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #bdbdbd;
        }
        
        .btn-success {
            background: #2e7d32;
            color: white;
        }
        
        .btn-success:hover {
            background: #1b5e20;
        }
        
        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔒</div>
        <h1>🚫 Truy cập bị chặn</h1>
        <p class="subtitle">
            Trang web này đã bị bạn chặn từ trước. 
            Bạn có thể bỏ chặn nếu muốn.
        </p>
        
        <div class="info-box">
            <div class="label">🌐 Domain</div>
            <div class="value domain" id="blockedDomain">Đang tải...</div>
            
            <div style="margin-top: 12px;">
                <div class="label">📅 Thời gian chặn</div>
                <div class="value" id="blockedAt">Đang tải...</div>
            </div>
            
            <div style="margin-top: 12px;">
                <div class="label">📝 Lý do</div>
                <div class="value" id="blockedReason">Đang tải...</div>
            </div>
        </div>
        
        <div class="actions">
           
            <button class="btn btn-secondary" id="backBtn">
                🔙 Quay lại
            </button>
        </div>
        
        <div class="footer">
            🛡️ SafeNet Protector · Bảo vệ bởi AI
        </div>
    </div>

    <script>
        // Lấy thông tin từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const domain = urlParams.get('domain') || 'Không xác định';
        const blockedAt = urlParams.get('blockedAt') || '';
        const reason = urlParams.get('reason') || 'Người dùng chặn thủ công';
        
        // Hiển thị thông tin
        document.getElementById('blockedDomain').textContent = domain;
        document.getElementById('blockedReason').textContent = reason;
        
        if (blockedAt) {
            const date = new Date(blockedAt);
            document.getElementById('blockedAt').textContent = date.toLocaleString('vi-VN');
        } else {
            document.getElementById('blockedAt').textContent = 'Không có thông tin';
        }
        
        // Xử lý nút "Bỏ chặn"
        document.getElementById('unblockBtn').addEventListener('click', async () => {
            try {
                // Gửi message đến background để bỏ chặn
                const response = await chrome.runtime.sendMessage({
                    type: 'REMOVE_BLOCKED',
                    domain: domain
                });
                
                if (response.success) {
                    alert('✅ Đã bỏ chặn thành công!\nBạn có thể truy cập trang này.');
                    window.location.href = 'https://' + domain;
                } else {
                    alert('❌ Lỗi bỏ chặn: ' + (response.error || 'Không xác định'));
                }
            } catch (error) {
                alert('❌ Lỗi: ' + error.message);
            }
        });
        
        // Xử lý nút "Quay lại"
        document.getElementById('backBtn').addEventListener('click', () => {
            window.history.back();
        });
        
        console.log('📄 Trang chặn hiển thị cho domain:', domain);
    </script>
</body>
</html>
